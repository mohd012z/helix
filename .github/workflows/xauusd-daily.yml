name: XAUUSD Daily Verified Snapshot

on:
  workflow_dispatch:

  # Refresh immediately when trusted data-pipeline code changes on main.
  # Generated snapshot commits are intentionally excluded to prevent loops.
  push:
    branches: [main]
    paths:
      - 'scripts/update_xauusd.py'
      - 'scripts/normalize_snapshot_semantics.py'
      - 'scripts/redact_public_data.py'
      - 'scripts/news_relevance.py'
      - 'requirements.txt'
      - '.github/workflows/xauusd-daily.yml'

  schedule:
    - cron: '10 7 * * *'
      timezone: 'Asia/Kuala_Lumpur'

permissions:
  contents: write

# Prevent the daily publisher from racing PR provider verification.
# Do not cancel live provider runs mid-request.
concurrency:
  group: helix-live-twelve-data
  cancel-in-progress: false

jobs:
  update:
    name: Update XAUUSD Daily Data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate verified daily snapshot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/update_xauusd.py

      - name: Normalize snapshot semantics
        run: python scripts/normalize_snapshot_semantics.py

      - name: Secure and verify public data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/redact_public_data.py

      - name: Enforce 12-of-16 board contract before publication
        run: python scripts/verify_board.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "xau-desk-bot"
          git config user.email "xau-desk-bot@users.noreply.github.com"

          git add xauusd-data.js

          if git diff --cached --quiet; then
            echo "No snapshot change to commit"
          else
            git commit -m "data: refresh XAUUSD daily snapshot"
            git push origin main
          fi

      - name: Daily update summary
        if: always()
        run: |
          echo "===================================="
          echo "XAU DESK DAILY UPDATE"
          echo "===================================="
          echo "Time zone : Asia/Kuala_Lumpur"
          echo "Schedule  : 07:10 MYT daily + trusted pipeline changes"
          echo "Branch    : main"
          echo "Schema    : DAILY_CLOSE + rollingHigh normalized before publish"
          echo "News      : XAU/gold + macro relevance gate before publish"
          echo "===================================="

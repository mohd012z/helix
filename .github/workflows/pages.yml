name: Deploy VEYRA to GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'board.html'
      - 'xauusd-data.js'
      - 'macro-preview.html'
      - 'macro/**'
      - 'invo-methods/**'
      - 'data/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'

  # GITHUB_TOKEN commits from the daily updater do not normally start another
  # push workflow. workflow_run keeps Pages synchronized after a verified
  # snapshot completes.
  workflow_run:
    workflows:
      - "XAUUSD Daily Verified Snapshot"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-veyra
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VEYRA

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare VEYRA website
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp xauusd-data.js _site/xauusd-data.js

          if [ -f "board.html" ]; then
            cp board.html _site/board.html
          fi

          if [ -f "macro-preview.html" ]; then
            cp macro-preview.html _site/macro-preview.html
          fi

          if [ -d "macro" ]; then
            cp -R macro _site/macro
          fi

          if [ -d "invo-methods" ]; then
            cp -R invo-methods _site/invo-methods
          fi

          if [ -d "data" ]; then
            cp -R data _site/data
          fi

          if [ -f ".nojekyll" ]; then
            cp .nojekyll _site/.nojekyll
          else
            touch _site/.nojekyll
          fi

          # The production index is now the VEYRA/HELIX runtime. Do not inject
          # the retired XAU-DESK embedded-snapshot renderer contract. Validate
          # the runtime-safety module as a shipped asset instead.
          test -s _site/index.html
          test -s _site/xauusd-data.js
          test -f _site/macro/ui/runtime-safety.js
          test -s _site/invo-methods/index.html
          test -s _site/invo-methods/signal-lab.mjs
          grep -q 'VEYRA' _site/index.html

          echo "Files prepared:"
          find _site -maxdepth 3 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "===================================="
          echo "VEYRA / HELIX PULSE DEPLOYED"
          echo "===================================="
          echo "Branch : main"
          echo "Home   : index.html"
          echo "Preview: macro-preview.html"
          echo "Data   : xauusd-data.js + data/event-history.json"
          echo "Safety : macro/ui/runtime-safety.js shipped with runtime"
          echo "===================================="

# Live provider gate for the market board.
# Triggers on pull_request (a branch push alone never fires for PR branches —
# GitHub evaluates workflows from the PR head on pull_request events).
# Runs full generate -> normalize -> redact -> contract against the real
# Twelve Data key, so PR checks show measured per-symbol coverage: plan-gated
# symbols (e.g. XAG/USD on the free tier) appear LABELLED UNAVAILABLE in the
# snapshot, which the contract accepts as long as >= MIN_OK symbols are OK.
name: Market Board Provider Verify

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  board:
    name: Verify board against live provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate snapshot with board (live Twelve Data)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/update_xauusd.py

      - name: Normalize + redact (same contract as the daily job)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/normalize_snapshot_semantics.py
          python scripts/redact_public_data.py

      - name: Enforce board contract on the generated snapshot
        run: python scripts/verify_board.py

# Branch gate for the market board PR only. Not merged to main: on main the
# daily snapshot (which has no board yet until this PR lands) would fail the
# contract, so after merge the daily workflow's own green run is the board's
# live verification. Delete this file in the merge commit or keep it
# dormant — it only fires on its own branch.
name: Market Board Provider Verify

on:
  workflow_dispatch:
  push:
    branches:
      - feat/market-board-commodities-fx-digital

permissions:
  contents: read

jobs:
  board:
    name: Verify board against live provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate snapshot with board (live Twelve Data)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/update_xauusd.py

      - name: Normalize + redact (same contract as the daily job)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/normalize_snapshot_semantics.py
          python scripts/redact_public_data.py

      - name: Enforce board contract on the generated snapshot
        run: python scripts/verify_board.py

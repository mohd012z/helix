name: HELIX VEYRA CI

on:
  push:
    paths:
      - 'index.html'
      - 'macro/**'
      - 'market-lab/**'
      - 'data/**'
      - 'scripts/**'
      - 'config/**'
      - 'tools/**'
      - 'macro-preview.html'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/macro-desk-ci.yml'
      - '.github/workflows/macro-phase3-ci.yml'
      - '.github/workflows/xauusd-daily.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'macro/**'
      - 'market-lab/**'
      - 'data/**'
      - 'scripts/**'
      - 'config/**'
      - 'tools/**'
      - 'macro-preview.html'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/macro-desk-ci.yml'
      - '.github/workflows/macro-phase3-ci.yml'
      - '.github/workflows/xauusd-daily.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run existing market and macro tests
        run: node --test tests/js/*.test.mjs

      - name: Run HELIX VEYRA migration tests
        run: node --test tests/*.test.mjs

      - name: Run HELIX VEYRA migration safety gate
        run: node tools/verify-migration.mjs

      - name: Check JavaScript syntax
        run: |
          node --check config/product-identity.mjs
          node --check config/endpoints.mjs
          node --check tools/rename-audit.mjs
          node --check tools/endpoint-audit.mjs
          node --check tools/security/secret-scan.mjs
          node --check tools/verify-migration.mjs
          node --check macro/core/instruments.mjs
          node --check macro/core/events.mjs
          node --check macro/core/reaction.mjs
          node --check macro/core/feed-status.mjs
          node --check macro/core/time-myt.mjs
          node --check macro/core/distribution.mjs
          node --check macro/core/plan-quality.mjs
          node --check macro/core/pivot-target.mjs
          node --check macro/adapters/snapshot-adapter.mjs
          node --check macro/adapters/event-feed-adapter.mjs
          node --check macro/adapters/history-adapter.mjs
          node --check macro/history/history-schema.mjs
          node --check macro/history/reaction-sample.mjs
          node --check macro/history/anti-leakage.mjs
          node --check macro/history/similarity.mjs
          node --check macro/history/distribution.mjs
          node --check macro/history/scenarios.mjs
          node --check macro/history/confidence.mjs
          node --check macro/history/advance-model.mjs
          node --check macro/events/event-record.mjs
          node --check macro/events/affected-assets.mjs
          node --check macro/events/detector.mjs
          node --check macro/events/speech.mjs
          node --check macro/events/event-store.mjs
          node --check macro/events/recalculate.mjs
          node --check macro/events/trade-plan.mjs
          node --check macro/events/trade-plan-revisions.mjs
          node --check macro/ui/advance-model-view.mjs
          node --check macro/ui/market-board.mjs
          node --check macro/ui/trade-plan-view.mjs
          node --check macro/ui/trade-plan-controller.mjs
          node --check macro/ui/trade-plan-integration.mjs
          node --check macro/ui/runtime-safety.js
          node --check macro/ui/app.mjs
          node --check market-lab/core.mjs
          node --check market-lab/chart-templates.mjs
          node --check market-lab/comparison.mjs
          node --check market-lab/compare-view.mjs
          node --check market-lab/matrix.mjs
          node --check market-lab/matrix-view.mjs
          node --check market-lab/map-embed.mjs
          node --check market-lab/market-lab.mjs

      - name: Install Python dependencies for collector tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax and collector tests
        run: |
          python --version
          python -m py_compile scripts/*.py
          # Board contract is enforced whenever the published snapshot carries
          # a board (always, once the board pipeline lands on main).
          if grep -q '"board"' xauusd-data.js 2>/dev/null; then
            python scripts/verify_board.py
          fi
          if [ -d "scripts/event_history" ]; then
            python -m py_compile scripts/event_history/*.py
          fi
          if [ -d "tests/python" ]; then
            python -m unittest discover -s tests/python -p 'test_*.py'
          fi

      - name: Validate public event history JSON
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('data/event-history.json','utf8'));if(p.schemaVersion!=='1.0'||!Array.isArray(p.samples))process.exit(1)"

      - name: Repository-wide source safety checks
        run: |
          ! git grep -I -n -E 'apikey=[A-Za-z0-9_-]{8,}|TWELVE_DATA_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{8,}|NEWS_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{8,}|FRED_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{8,}'
          ! grep -R -E 'BUY setup|SELL setup|Stop loss|Take profit' macro/events macro/history macro/ui/trade-plan-*.mjs macro/ui/advance-model-view.mjs macro-preview.html
